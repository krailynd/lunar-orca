[package]
name = "lunar-core"
version = "0.1.0"
edition = "2021"
authors = ["Lunar Orca Team"]
description = "Native high-performance core for Lunar-Orca: terminal sanitization, workspace indexing, and security boundaries"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
